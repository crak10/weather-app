<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Mobile-first -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clima App | Portafolio</title>

  <!-- Favicon con emoji -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌤️</text></svg>">

  <!-- Bootstrap 5 vía CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons vía CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Hoja de estilos propia -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="weather-app d-flex flex-column align-items-center justify-content-center min-vh-100 px-3">

    <!-- TÍTULO -->
    <h1 class="app-title text-center mb-4">
      <i class="bi bi-cloud-sun-fill me-2"></i>Clima App
    </h1>

    <!-- BUSCADOR -->
    <form id="search-form" class="search-box w-100 mb-3" style="max-width: 500px;">
      <div class="input-group input-group-lg shadow-sm">
        <span class="input-group-text bg-white border-0">
          <i class="bi bi-geo-alt-fill text-primary"></i>
        </span>
        <input
          type="text"
          id="city-input"
          class="form-control border-0"
          placeholder="Escribe una ciudad (ej. Lima, Madrid)"
          aria-label="Nombre de la ciudad"
          autocomplete="off"
          required
        >
        <button class="btn btn-primary px-4" type="submit" id="search-btn">
          <i class="bi bi-search"></i>
        </button>
      </div>
    </form>

    <!-- LOADER -->
    <div id="loader" class="loader-container d-none text-center my-4">
      <div class="spinner-border text-light" role="status" style="width: 3rem; height: 3rem;">
        <span class="visually-hidden">Buscando...</span>
      </div>
      <p class="mt-2 text-white-50 fw-semibold">Buscando...</p>
    </div>

    <!-- MENSAJE DE ERROR -->
    <div id="error-message" class="alert alert-danger d-none w-100 text-center" style="max-width: 500px;" role="alert">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>
      <span id="error-text">Ciudad no encontrada, intenta de nuevo.</span>
    </div>

    <!-- TARJETA DEL CLIMA -->
    <article id="weather-card" class="weather-card d-none w-100" style="max-width: 500px;">
      <header class="weather-card__header text-center mb-3">
        <h2 id="city-name" class="weather-card__city mb-0">Ciudad</h2>
        <p id="country-name" class="weather-card__country mb-0">País</p>
      </header>

      <div class="weather-card__main d-flex align-items-center justify-content-center gap-3 mb-4">
        <img
          id="weather-icon"
          src=""
          alt="Ícono del clima"
          class="weather-card__icon"
          width="100"
          height="100"
        >
        <div class="weather-card__temp-box">
          <span id="temperature" class="weather-card__temp display-3 fw-bold">--</span>
          <span class="weather-card__unit fs-4">°C</span>
        </div>
      </div>

      <p id="weather-description" class="weather-card__description text-center text-capitalize mb-4">
        --
      </p>

      <div class="weather-card__details d-flex justify-content-around">
        <div class="weather-detail text-center">
          <i class="bi bi-droplet-fill weather-detail__icon fs-3"></i>
          <p class="weather-detail__label mb-0">Humedad</p>
          <p id="humidity" class="weather-detail__value fw-bold mb-0">--%</p>
        </div>

        <div class="weather-detail text-center">
          <i class="bi bi-wind weather-detail__icon fs-3"></i>
          <p class="weather-detail__label mb-0">Viento</p>
          <p id="wind-speed" class="weather-detail__value fw-bold mb-0">-- km/h</p>
        </div>
      </div>
    </article>

    <footer class="app-footer text-center mt-4">
      <small class="text-white-50">
        Datos por <a href="https://openweathermap.org/" target="_blank" rel="noopener" class="text-white-50">OpenWeatherMap</a>
      </small>
    </footer>

  </main>

  <!-- ⚠️ IMPORTANTE: Cargamos primero la configuración de la API y luego la lógica -->
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
